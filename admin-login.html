<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff sign in — SafariQuest</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</head>

<body data-sq-skip-chrome="true">

  <div class="page-wrapper">

    <div class="left-panel">
      <div class="panel-logo">
        <div class="panel-logo-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path
              d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <span>SafariQuest</span>
      </div>
      <div class="panel-overlay"></div>
      <div class="panel-content">
        <blockquote class="panel-quote">
          <em>Staff access only.</em>
        </blockquote>
        <div class="quote-divider"></div>
        <cite class="quote-author">&mdash; Admin portal</cite>
      </div>
    </div>

    <div class="right-panel">
      <div class="form-container">

        <div class="form-header">
          <h1>Staff sign in</h1>
          <p>Use your authorized account to open the admin dashboard.</p>
          <div class="form-divider"></div>
        </div>

        <form class="login-form" id="adminLoginForm" novalidate>

          <div class="field-group">
            <label for="email">EMAIL ADDRESS</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
              </span>
              <input type="email" id="email" name="email" placeholder="Work email" autocomplete="email" />
            </div>
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field-group">
            <label for="password">PASSWORD</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
              <input type="password" id="password" name="password" placeholder="••••••••"
                autocomplete="current-password" />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
                <svg class="eye-open" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                  viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-closed" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                  viewBox="0 0 24 24" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <div class="form-options">
            <span></span>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">Continue to dashboard</span>
            <span class="btn-spinner" id="btnSpinner" style="display:none">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.3" />
                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round" />
              </svg>
            </span>
          </button>

          <div class="signup-prompt" style="margin-top: 1.25rem;">
            Traveller? <a href="login.html" class="signup-link">Customer login</a>
          </div>

        </form>
      </div>
    </div>

  </div>

  <script src="admin-login.js"></script>
</body>

</html>
