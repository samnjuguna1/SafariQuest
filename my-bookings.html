<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — SafariQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth-ui.css" />
  <script src="auth.js" defer></script>
  <script src="page-protection.js" defer></script>
  <style>
    :root {
      --green: #1a4731;
      --green-mid: #2d6a4f;
      --gold: #c9932a;
      --gold-light: #f4c56a;
      --cream: #fdf8f0;
      --warm-grey: #f5f0e8;
      --text: #1c1c1c;
      --muted: #6b7280;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── PAGE HERO ── */
    .page-hero {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-mid) 60%, #1b5e38 100%);
      padding: 3.5rem 2rem 3rem;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1400&q=60') center/cover no-repeat;
      opacity: 0.12;
    }
    .page-hero-inner { max-width: 1100px; margin: 0 auto; position: relative; }
    .page-hero h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; margin-bottom: 0.5rem; }
    .page-hero p { color: rgba(255,255,255,0.78); font-size: 1rem; }

    /* ── CONTENT ── */
    .content { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 0.4rem;
      background: var(--white);
      padding: 6px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      width: fit-content;
    }
    .tab-btn {
      padding: 9px 22px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--green); color: var(--white); }
    .tab-btn:hover:not(.active) { background: var(--warm-grey); color: var(--text); }

    /* ── STATS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.2rem 1.4rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .stat-icon {
      font-size: 1.8rem;
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .stat-icon.green { background: rgba(45,106,79,0.12); }
    .stat-icon.gold  { background: rgba(201,147,42,0.12); }
    .stat-icon.blue  { background: rgba(59,130,246,0.1); }
    .stat-icon.red   { background: rgba(239,68,68,0.1); }
    .stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); line-height: 1.2; }

    /* ── BOOKINGS ── */
    .bookings-grid { display: flex; flex-direction: column; gap: 1.2rem; }

    .booking-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 200px 1fr auto;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.4s ease both;
    }
    .booking-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.12); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .booking-img { width: 200px; height: 140px; object-fit: cover; }

    .booking-info { padding: 1.2rem 1.4rem; }
    .booking-type { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--gold); margin-bottom: 4px; }
    .booking-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
    .booking-meta {
      display: flex; flex-wrap: wrap; gap: 0.8rem;
      font-size: 0.82rem; color: var(--muted); margin-bottom: 10px;
    }
    .booking-meta span { display: flex; align-items: center; gap: 4px; }
    .booking-amount { font-size: 1.1rem; font-weight: 700; color: var(--green); }

    .booking-actions {
      padding: 1.2rem 1.4rem;
      display: flex; flex-direction: column;
      align-items: flex-end; justify-content: space-between;
      min-width: 140px;
    }
    .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-confirmed { background: rgba(34,197,94,0.12); color: #16a34a; }
    .status-pending   { background: rgba(234,179,8,0.12);  color: #ca8a04; }
    .status-cancelled { background: rgba(239,68,68,0.1);   color: #dc2626; }
    .status-completed { background: rgba(59,130,246,0.1);  color: #2563eb; }

    .action-btns { display: flex; flex-direction: column; gap: 8px; }
    .btn-sm {
      padding: 7px 14px; border-radius: 8px; font-size: 0.8rem;
      font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; text-align: center;
    }
    .btn-primary { background: var(--green); color: var(--white); }
    .btn-primary:hover { background: var(--green-mid); }
    .btn-outline { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
    .btn-outline:hover { background: var(--green); color: var(--white); }
    .btn-danger { background: transparent; color: #dc2626; border: 1.5px solid #dc2626; }
    .btn-danger:hover { background: #dc2626; color: var(--white); }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
    .empty-state .emoji { font-size: 3.5rem; margin-bottom: 1rem; display: block; }
    .empty-state h3 { font-size: 1.2rem; color: var(--text); margin-bottom: 0.5rem; }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem;
    }
    .section-header h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; }
    .filter-row { display: flex; gap: 0.6rem; }
    .filter-select {
      padding: 7px 12px; border-radius: 8px; border: 1.5px solid #e5e7eb;
      font-family: 'DM Sans', sans-serif; font-size: 0.83rem;
      background: var(--white); color: var(--text); cursor: pointer;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: var(--radius); padding: 2rem;
      width: 90%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: fadeUp 0.3s ease;
    }
    .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 1rem; }
    .modal-detail {
      display: flex; justify-content: space-between;
      padding: 0.7rem 0; border-bottom: 1px solid #f3f4f6; font-size: 0.9rem;
    }
    .modal-detail:last-of-type { border-bottom: none; }
    .modal-detail .label { color: var(--muted); }
    .modal-detail .value { font-weight: 600; }
    .modal-footer { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
    .modal-footer button { flex: 1; }
    .close-modal { float: right; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); }

    @media (max-width: 700px) {
      .booking-card { grid-template-columns: 1fr; }
      .booking-img { width: 100%; height: 180px; }
      .booking-actions { flex-direction: row; align-items: center; padding-top: 0; }
    }
  </style>
</head>
<body data-nav-active="">

<div id="sq-nav-root"></div>



<!-- HERO -->
<div class="page-hero">
  <div class="page-hero-inner">
    <h1>🗓️ My Bookings</h1>
    <p>Track, manage, and review all your Kenyan adventures in one place</p>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon green">🧳</div>
      <div>
        <div class="stat-label">Total Bookings</div>
        <div class="stat-value" id="totalCount">5</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon gold">✅</div>
      <div>
        <div class="stat-label">Confirmed</div>
        <div class="stat-value" id="confirmedCount">2</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue">🌟</div>
      <div>
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="completedCount">2</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">💰</div>
      <div>
        <div class="stat-label">Total Spent</div>
        <div class="stat-value" id="totalSpent">KES 0</div>
      </div>
    </div>
  </div>

  <!-- TABS + FILTERS -->
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem;">
    <div class="tabs">
      <button class="tab-btn active" onclick="filterTab('all', this)">All</button>
      <button class="tab-btn" onclick="filterTab('confirmed', this)">Confirmed</button>
      <button class="tab-btn" onclick="filterTab('pending', this)">Pending</button>
      <button class="tab-btn" onclick="filterTab('completed', this)">Completed</button>
      <button class="tab-btn" onclick="filterTab('cancelled', this)">Cancelled</button>
    </div>
    <div class="filter-row">
      <select class="filter-select" onchange="sortBookings(this.value)">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="amount">By Amount</option>
      </select>
    </div>
  </div>

  <!-- BOOKINGS LIST -->
  <div class="bookings-grid" id="bookingsGrid"></div>

</div>

<!-- BOOKING DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="close-modal" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">Booking Details</h3>
    <div id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-sm btn-outline" onclick="closeModal()">Close</button>
      <button class="btn-sm btn-primary" onclick="downloadReceipt()">⬇ Download Receipt</button>
    </div>
  </div>
</div>

<!-- FOOTER -->


<script>
  let currentFilter = 'all';
  let currentBookings = [];

  // Show skeleton loading state
  function showLoading() {
    document.getElementById('bookingsGrid').innerHTML = `
      <div style="text-align:center;padding:3rem;color:var(--muted)">
        <div style="font-size:2rem;margin-bottom:1rem">⏳</div>
        <p>Loading your bookings…</p>
      </div>`;
  }

  async function loadBookings() {
    showLoading();
    let remoteBookings = [];

    if (window.SQ && window.SQ.isLoggedIn()) {
      try {
        remoteBookings = await window.SQ.listUserBookings();
      } catch (e) {
        console.warn('Could not load bookings from Supabase:', e);
      }
    }

    // Normalize Supabase rows to display format
    const fromSupabase = remoteBookings.map(b => ({
      id:       b.id || ('SQ-' + Date.now()),
      type:     b.booking_type || b.type || 'Hotel',
      title:    b.attraction_name || b.title || 'Booking',
      location: b.attraction_location || b.location || 'Kenya',
      date:     b.check_in || b.date || b.created_at,
      guests:   b.guests || b.guest_count || 1,
      amount:   b.total_price || b.amount || 0,
      status:   (b.status || 'confirmed').toLowerCase(),
      ref:      b.payment_ref || b.ref || 'N/A',
      img:      b.image_url || b.img || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&q=70'
    }));

    // Also read localStorage fallback (written by hotels.html when offline/not logged in)
    let fromLocal = [];
    try {
      const raw = JSON.parse(localStorage.getItem('sq_bookings') || '[]');
      fromLocal = raw.map(b => ({
        id:       b.id || ('SQ-' + Date.now()),
        type:     'Hotel',
        title:    b.attraction || 'Hotel Booking',
        location: 'Kenya',
        date:     b.checkIn || b.bookedAt || '',
        guests:   parseInt(b.guests) || 1,
        amount:   parseInt((b.total || '0').replace(/[^0-9]/g, '')) || 0,
        status:   (b.status || 'confirmed').toLowerCase(),
        ref:      'Local-' + b.id,
        img:      'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&q=70'
      }));
    } catch(e) {}

    // Merge: Supabase is authoritative; only add local entries not already in Supabase
    const supabaseIds = new Set(fromSupabase.map(b => b.ref));
    const uniqueLocal = fromLocal.filter(b => !supabaseIds.has(b.ref));
    currentBookings = [...fromSupabase, ...uniqueLocal];

    updateStats();
    renderBookings();
  }

  function updateStats() {
    const confirmed = currentBookings.filter(b => b.status === 'confirmed').length;
    const completed = currentBookings.filter(b => b.status === 'completed').length;
    const spent = currentBookings.filter(b => b.status !== 'cancelled').reduce((s, b) => s + b.amount, 0);
    document.getElementById('totalCount').textContent = currentBookings.length;
    document.getElementById('confirmedCount').textContent = confirmed;
    document.getElementById('completedCount').textContent = completed;
    document.getElementById('totalSpent').textContent = `KES ${spent.toLocaleString()}`;
  }

  function renderBookings() {
    const grid = document.getElementById('bookingsGrid');
    let list = currentBookings;
    if (currentFilter !== 'all') list = list.filter(b => b.status === currentFilter);

    if (list.length === 0) {
      grid.innerHTML = `<div class="empty-state">
        <span class="emoji">🏕️</span>
        <h3>No ${currentFilter === 'all' ? '' : currentFilter} bookings yet</h3>
        <p>Start exploring Kenya to make your first booking!</p>
        <br/>
        <a href="destinations.html" class="btn-sm btn-primary" style="text-decoration:none;padding:10px 22px;border-radius:9px;background:var(--green);color:#fff;font-weight:600;">Explore Destinations</a>
      </div>`;
      return;
    }

    grid.innerHTML = list.map((b, i) => `
      <div class="booking-card" style="animation-delay:${i * 0.08}s">
        <img class="booking-img" src="${b.img}" alt="${b.title}" loading="lazy" />
        <div class="booking-info">
          <div class="booking-type">${b.type}</div>
          <div class="booking-title">${b.title}</div>
          <div class="booking-meta">
            <span>📍 ${b.location}</span>
            <span>📅 ${formatDate(b.date)}</span>
            <span>👥 ${b.guests} guest${b.guests > 1 ? 's' : ''}</span>
            <span>🔖 ${b.id}</span>
          </div>
          <div class="booking-amount">KES ${b.amount.toLocaleString()}</div>
        </div>
        <div class="booking-actions">
          <span class="status-badge status-${b.status}">${capitalize(b.status)}</span>
          <div class="action-btns">
            <button class="btn-sm btn-primary" onclick='viewDetails(${JSON.stringify(b).replace(/'/g,"&#39;")})'>View Details</button>
            ${b.status === 'confirmed' ? `<button class="btn-sm btn-outline" onclick="cancelBooking('${b.id}')">Cancel</button>` : ''}
            ${b.status === 'completed' ? `<a href="reviews.html?ref=${b.id}" class="btn-sm btn-outline" style="text-decoration:none;display:block">★ Review</a>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  function filterTab(status, btn) {
    currentFilter = status;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBookings();
  }

  function sortBookings(val) {
    if (val === 'newest') currentBookings.sort((a, b) => new Date(b.date) - new Date(a.date));
    if (val === 'oldest') currentBookings.sort((a, b) => new Date(a.date) - new Date(b.date));
    if (val === 'amount') currentBookings.sort((a, b) => b.amount - a.amount);
    renderBookings();
  }

  let activeBooking = null;
  function viewDetails(b) {
    activeBooking = b;
    document.getElementById('modalTitle').textContent = b.title;
    document.getElementById('modalBody').innerHTML = `
      <div class="modal-detail"><span class="label">Booking ID</span><span class="value">${b.id}</span></div>
      <div class="modal-detail"><span class="label">Type</span><span class="value">${b.type}</span></div>
      <div class="modal-detail"><span class="label">Location</span><span class="value">${b.location}</span></div>
      <div class="modal-detail"><span class="label">Date</span><span class="value">${formatDate(b.date)}</span></div>
      <div class="modal-detail"><span class="label">Guests</span><span class="value">${b.guests}</span></div>
      <div class="modal-detail"><span class="label">Total Paid</span><span class="value" style="color:var(--green)">KES ${b.amount.toLocaleString()}</span></div>
      <div class="modal-detail"><span class="label">Payment Ref</span><span class="value">${b.ref}</span></div>
      <div class="modal-detail"><span class="label">Status</span><span class="value"><span class="status-badge status-${b.status}">${capitalize(b.status)}</span></span></div>
    `;
    document.getElementById('detailModal').classList.add('open');
  }

  function closeModal() { document.getElementById('detailModal').classList.remove('open'); }

  async function cancelBooking(id) {
    if (!confirm('Are you sure you want to cancel this booking?')) return;
    // Try to update in Supabase
    if (window.SQ && window.SQ.isLoggedIn()) {
      try {
        await window.SQ.updateUserBooking(id, { status: 'cancelled' });
      } catch (e) {
        console.warn('Could not cancel in Supabase:', e);
      }
    }
    currentBookings = currentBookings.map(b => b.id === id ? { ...b, status: 'cancelled' } : b);
    updateStats();
    renderBookings();
  }

  function downloadReceipt() {
    if (!activeBooking) return;
    const b = activeBooking;
    const content = `SAFARIQUEST BOOKING RECEIPT\n${'='.repeat(40)}\nBooking ID: ${b.id}\nDestination: ${b.title}\nLocation:   ${b.location}\nDate:       ${formatDate(b.date)}\nGuests:     ${b.guests}\nAmount:     KES ${b.amount.toLocaleString()}\nPayment:    ${b.ref}\nStatus:     ${capitalize(b.status)}\n${'='.repeat(40)}\nThank you for choosing SafariQuest!\nDiscover. Explore. Experience.`;
    const blob = new Blob([content], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${b.id}-receipt.txt`;
    a.click();
  }

  function formatDate(d) {
    return new Date(d).toLocaleDateString('en-KE', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  document.getElementById('detailModal').addEventListener('click', e => {
    if (e.target === document.getElementById('detailModal')) closeModal();
  });

  // Wait for auth.js (defer) to finish before loading data
  document.addEventListener('DOMContentLoaded', function() { loadBookings(); });
</script>
<div id="sq-footer-root"></div>

<script src="site-layout.js"></script>
<script src="nav-auth.js"></script>

</body>
</html>
