<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update Password — SafariQuest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth-ui.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0; padding: 0; font-family: 'DM Sans', sans-serif;
      background: var(--sand-light, #fdf8f0); color: var(--text-primary, #1c1c1c);
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .auth-card {
      background: var(--white, #ffffff); border-radius: var(--radius, 12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 40px;
      width: 100%; max-width: 480px; text-align: center;
      border: 1px solid var(--border, #e5e7eb); margin: 20px;
    }
    .logo {
      width: 50px; height: 50px; border-radius: 50%; object-fit: cover;
      margin: 0 auto 16px; display: block;
    }
    h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 8px; color: var(--earth-dark, #0f2e1f); }
    p.subtitle { color: var(--text-muted, #6b7280); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5; }
    
    .form-group { text-align: left; margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; background: #fafafa;
      outline: none; transition: all 0.2s; box-sizing: border-box;
    }
    .form-input:focus { border-color: var(--savanna, #c9932a); background: white; }
    .form-input.error { border-color: #dc2626; }
    
    .btn-submit {
      width: 100%; padding: 14px; background: var(--earth, #2d6a4f); color: white;
      border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s; position: relative; display: flex; align-items: center; justify-content: center;
    }
    .btn-submit:hover { background: var(--earth-dark, #0f2e1f); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white;
      border-radius: 50%; animation: spin 0.8s linear infinite; display: none; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; display: none; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: flex; align-items: center; gap:10px; text-align: left;}
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; margin-bottom: 16px; text-align: left;}

    .icon-success { font-size: 1.5rem; }
    .link-primary { color: var(--earth); font-weight: 600; text-decoration: underline; }
  </style>
</head>
<body data-nav-active="">

<div id="sq-nav-root"></div>



  <div class="auth-card" id="cardContainer">
    <img src="logo.jpeg" alt="SafariQuest Logo" class="logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/50/?text=SQ'"/>
    <h2>Set New Password</h2>
    <p class="subtitle" id="subtitleText">Please choose a strong, secure password.</p>

    <!-- Error state -->
    <div class="alert alert-error" id="errorMsg"></div>

    <!-- Success state -->
    <div class="alert alert-success" id="successMsg">
      <div class="icon-success">✓</div>
      <div>Password updated successfully! <br><a href="index.html" class="link-primary">Please log in</a>.</div>
    </div>

    <!-- Expired/Invalid token state -->
    <div id="expiredState" style="display: none; text-align:center;">
      <p style="color:var(--text-muted); margin-bottom:20px;">This link has expired or is invalid. Please request a new one.</p>
      <a href="forgot-password.html" class="btn-submit" style="text-decoration:none; display:inline-flex;">Request New Link</a>
    </div>

    <form id="updateForm" onsubmit="handleUpdate(event)">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" id="passInput" class="form-input" placeholder="••••••••" required minlength="6" />
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirmInput" class="form-input" placeholder="••••••••" required minlength="6" />
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Update Password</span>
      </button>
    </form>

  </div>

<script>
  // Supabase Init Placeholder
  const SUPABASE_URL  = 'https://cbyipmrozqsntojiartw.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNieWlwbXJvenFzbnRvamlhcnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTkxNTQsImV4cCI6MjA4ODk3NTE1NH0.31TAhmUCV_Uh0W8FGnR2_TLCZDU4YBM1U5LMSMc5JZs';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  function showExpiredFromHash() {
    document.getElementById('updateForm').style.display = 'none';
    document.getElementById('subtitleText').style.display = 'none';
    document.getElementById('expiredState').style.display = 'block';
    const err = new URLSearchParams(window.location.hash.substring(1)).get('error_description');
    if (err) {
      const el = document.getElementById('errorMsg');
      el.textContent = decodeURIComponent(err).replace(/\+/g, ' ');
      el.style.display = 'block';
    }
  }

  function showDirectVisitHint() {
    document.getElementById('updateForm').style.display = 'none';
    document.getElementById('subtitleText').textContent =
      'Open the password reset link from your email to reach this page.';
    document.getElementById('expiredState').style.display = 'block';
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const hash = window.location.hash || '';
    if (hash.includes('error_code')) {
      showExpiredFromHash();
      return;
    }

    let session = (await _supabase.auth.getSession()).data.session;
    if (!session && /access_token|type=recovery/i.test(hash)) {
      await new Promise(function (r) { setTimeout(r, 200); });
      session = (await _supabase.auth.getSession()).data.session;
    }

    if (!session && !hash) {
      showDirectVisitHint();
    }
  });

  async function handleUpdate(e) {
    e.preventDefault();
    const passInput = document.getElementById('passInput');
    const confirmInput = document.getElementById('confirmInput');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const successMsg = document.getElementById('successMsg');
    const updateForm = document.getElementById('updateForm');
    const subtitleText = document.getElementById('subtitleText');

    passInput.classList.remove('error');
    confirmInput.classList.remove('error');
    errorMsg.style.display = 'none';

    // Validation
    const pass = passInput.value;
    const confirm = confirmInput.value;
    if (pass !== confirm) {
      passInput.classList.add('error');
      confirmInput.classList.add('error');
      errorMsg.textContent = 'Passwords do not match.';
      errorMsg.style.display = 'block';
      return;
    }
    if (pass.length < 6) {
      passInput.classList.add('error');
      errorMsg.textContent = 'Password must be at least 6 characters.';
      errorMsg.style.display = 'block';
      return;
    }

    // Load state
    submitBtn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Updating...';

    const { data, error } = await _supabase.auth.updateUser({ password: pass });

    submitBtn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Update Password';

    if (error) {
      errorMsg.textContent = error.message;
      errorMsg.style.display = 'block';
    } else {
      updateForm.style.display = 'none';
      subtitleText.style.display = 'none';
      errorMsg.style.display = 'none';
      successMsg.style.display = 'flex';
      
      // Attempt sign out so they have to sign in with new credentials properly
      _supabase.auth.signOut();
    }
  }
</script>
<div id="sq-footer-root"></div>

<script src="site-layout.js"></script>
<script src="nav-auth.js"></script>

</body>
</html>
